<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <title>Dashboard Customer</title>
</head>
<body>
  <h1>Dashboard</h1>
  <nav>
    <a href="dashboard-customer.html" class="nav-customer">Dashboard</a>
    <a href="dashboard-admin.html" class="nav-admin">Admin</a>
    <a href="dashboard-owner.html" class="nav-owner">Owner</a>
    <a href="profile.html">Profil</a>
    <button id="logoutBtn">Logout</button>
  </nav>

  <section>
    <h2>Ringkasan</h2>
    <p>Total Pemasukan: <span id="totalIncome">0</span></p>
    <p>Total Pengeluaran: <span id="totalExpense">0</span></p>
    <p>Saldo: <span id="balance">0</span></p>
  </section>

  <section>
    <h2>Tambah Pemasukan</h2>
    <form id="incomeForm">
      <input type="text" id="source" placeholder="Sumber" required>
      <input type="text" id="incomeDescription" placeholder="Deskripsi">
      <input type="number" id="incomeAmount" placeholder="Jumlah" required>
      <input type="date" id="incomeDate" required>
      <button type="submit">Tambah</button>
    </form>
  </section>

  <section>
    <h2>Daftar Pemasukan</h2>
    <ul id="incomeList"></ul>
  </section>

  <section>
    <h2>Tambah Pengeluaran</h2>
    <form id="expenseForm">
    <input type="text" id="item" placeholder="Item" required>
    <input type="text" id="expenseDescription" placeholder="Deskripsi">
    <input type="number" id="expenseAmount" placeholder="Jumlah" required>
    <input type="date" id="expenseDate" required>
    <button type="submit">Tambah</button>
    </form>
  </section>

  <section>
    <h2>Daftar Pengeluaran</h2>
    <ul id="expenseList"></ul>
  </section>

  <script src="js/api.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>
