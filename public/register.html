<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <title>Register</title>
</head>
<body>
  <h1>Register</h1>
  <form id="registerForm">
    <input type="text" id="firstName" placeholder="Nama depan" required>
    <input type="text" id="lastName" placeholder="Nama belakang" required>
    <input type="email" id="email" placeholder="Email" required>
    <input type="text" id="username" placeholder="Username" required>
    <input type="password" id="password" placeholder="Password" required>
    <button type="submit">Register</button>
  </form>
  <p id="errorMsg" style="color: red;"></p>
  <p>Sudah punya akun? <a href="login.html">Login di sini</a></p>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
